name: Check reproduction scripts
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_published_data.py
      - run: for script in scripts/*.sh docker/*.sh; do bash -n "$script"; done
      - run: cp .env.example .env && docker compose --profile model config --quiet
